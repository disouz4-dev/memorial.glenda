<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memorial Glenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #25d366;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100dvh; overflow: hidden;
      background: #0a0c0f; color: #fff;
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(37,211,102,0.04) 0%, transparent 50%),
                  #0a0c0f;
    }

    #loading {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0c0f;
      display: flex; align-items: center; justify-content: center;
    }
    .spin-sm {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--green);
      border-radius: 50%; animation: giro 0.7s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem max(2rem, env(safe-area-inset-bottom));
      text-align: center;
    }

    .flor  { font-size: 2.4rem; margin-bottom: 1.2rem; animation: surgir 0.8s ease 0.1s both; }
    .nome  { font-family: var(--serif); font-size: clamp(3rem,10vw,5rem); font-weight: 400; letter-spacing: 0.06em; line-height: 1; margin-bottom: 0.5rem; animation: surgir 0.9s ease 0.2s both; }
    .datas { font-size: 0.78rem; font-weight: 300; letter-spacing: 0.22em; color: rgba(255,255,255,0.35); text-transform: uppercase; margin-bottom: 1rem; animation: surgir 0.9s ease 0.35s both; }
    .linha { width: 40px; height: 1px; background: var(--green); opacity: 0.7; margin: 0 auto 2rem; animation: surgir 0.9s ease 0.4s both; }

    /* Login */
    .login-box {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; gap: 0.75rem;
      animation: surgir 1s ease 0.55s both;
    }
    .login-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: #fff; font-size: 1rem; padding: 0.85rem 1rem;
      font-family: var(--sans); outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--green); }
    .login-input::placeholder { color: rgba(255,255,255,0.3); }
    .login-erro { font-size: 0.8rem; color: #ff6b6b; min-height: 1.1rem; text-align: center; }
    .login-btn {
      width: 100%; padding: 0.9rem; border-radius: 12px; border: none;
      background: var(--green); color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: all 0.2s; letter-spacing: 0.03em;
    }
    .login-btn:hover:not(:disabled) { background: #1db954; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,211,102,0.3); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: default; }
    .login-link {
      background: none; border: none; color: rgba(255,255,255,0.35);
      font-size: 0.78rem; font-family: var(--sans); cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px; width: 100%; text-align: center;
      padding: 0.2rem 0;
    }
    .login-link:hover { color: var(--green); }

    /* Cards do suporte */
    #suporte-view { display: none; width: 100%; max-width: 400px; }
    #suporte-view.visivel { display: block; animation: surgir 0.6s ease both; }
    .suporte-label { font-size: 0.82rem; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.2rem; }
    .cards { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.6rem; width: 150px; min-height: 150px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      cursor: pointer; transition: all 0.25s ease; color: #fff;
      backdrop-filter: blur(6px); padding: 1.5rem 1rem; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; inset: 0; border-radius: 20px;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.12) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.25s;
    }
    .card:hover::before { opacity: 1; }
    .card:hover { border-color: rgba(37,211,102,0.4); background: rgba(255,255,255,0.07); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(37,211,102,0.15); }
    .card:active { transform: translateY(-1px) scale(0.98); }
    .card-emoji { font-size: 2.2rem; line-height: 1; }
    .card-nome  { font-size: 1rem; font-weight: 600; }
    .card-papel { font-size: 0.72rem; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; }

    .rodape {
      position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0; right: 0; text-align: center;
      font-size: 0.72rem; color: rgba(255,255,255,0.18); letter-spacing: 0.06em;
      animation: surgir 1s ease 1s both;
    }

    /* Modal troca de senha */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(14px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.ativo { display: flex; }
    .modal-box {
      background: #12181f; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 2rem 2.5rem; text-align: center;
      min-width: 300px; max-width: 90vw; animation: surgir 0.4s ease both;
    }
    .modal-icone  { font-size: 2rem; margin-bottom: 0.8rem; }
    .modal-titulo { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 0.4rem; }
    .modal-sub    { font-size: 0.83rem; color: rgba(255,255,255,0.45); margin-bottom: 1.4rem; line-height: 1.5; }
    .modal-erro   { font-size: 0.8rem; color: #ff6b6b; min-height: 1.1rem; margin-top: 0.3rem; }
    .modal-ok-msg { font-size: 0.82rem; color: var(--green); margin-top: 0.6rem; }
    .modal-inputs { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.5rem; }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="loading"><div class="spin-sm"></div></div>

<div class="bg"></div>
<div class="page">
  <div class="flor">🌸</div>
  <h1 class="nome">Glenda</h1>
  <p class="datas">21 / 01 / 2004 — 30 / 07 / 2024</p>
  <div class="linha"></div>

  <!-- Login -->
  <div class="login-box" id="login-view">
    <input class="login-input" id="inp-email" type="email" placeholder="seu e-mail"
           autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('inp-senha').focus()">
    <input class="login-input" id="inp-senha" type="password" placeholder="senha"
           autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
    <div class="login-erro" id="login-erro"></div>
    <button class="login-btn" id="login-btn" onclick="fazerLogin()">Entrar</button>
    <button class="login-link" onclick="recuperarSenha()">Esqueci minha senha</button>
    <div class="login-ok-msg" id="login-ok-msg"></div>
  </div>

  <!-- Cards do suporte -->
  <div id="suporte-view">
    <p class="suporte-label">Qual memorial deseja acessar?</p>
    <div class="cards">
      <div class="card" onclick="location.href='mae.html'">
        <span class="card-emoji">💚</span>
        <span class="card-nome">Simone</span>
        <span class="card-papel">Mãe</span>
      </div>
      <div class="card" onclick="location.href='pai.html'">
        <span class="card-emoji">🐰</span>
        <span class="card-nome">Marcos</span>
        <span class="card-papel">Pai</span>
      </div>
    </div>
  </div>
</div>

<p class="rodape">Memorial Glenda &mdash; para sempre em nossos corações</p>

<!-- Modal: trocar senha no primeiro acesso -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <div class="modal-icone">🔒</div>
    <div class="modal-titulo">Defina sua senha</div>
    <div class="modal-sub">Por segurança, crie uma senha pessoal<br>para acessar o memorial.</div>
    <div class="modal-inputs">
      <input class="login-input" id="nova-senha" type="password" placeholder="nova senha"
             autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('conf-senha').focus()">
      <input class="login-input" id="conf-senha" type="password" placeholder="confirmar nova senha"
             autocomplete="new-password" onkeydown="if(event.key==='Enter')salvarSenha()">
    </div>
    <div class="modal-erro" id="modal-erro"></div>
    <button class="login-btn" id="btn-salvar" onclick="salvarSenha()" style="margin-top:0.8rem">Salvar senha</button>
    <div class="modal-ok-msg" id="modal-ok"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, updatePassword, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';

const firebaseConfig = {
  apiKey:            "AIzaSyCs3xecW_D39KkmyEr5GpcSX0O5SAjXME8",
  authDomain:        "memorialglenda08.firebaseapp.com",
  projectId:         "memorialglenda08",
  storageBucket:     "memorialglenda08.firebasestorage.app",
  messagingSenderId: "656108355499",
  appId:             "1:656108355499:web:11804b7dd4ad2300a3f9dd"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

const SENHA_PADRAO = '123456';

function perfilDoEmail(email) {
  if (email === 'MAE_EMAIL_AQUI')           return 'mae';
  if (email === 'contato@agenciagm.com.br') return 'pai';
  if (email === 'diegodisouza10@gmail.com') return 'suporte';
  return null;
}

function chaveAlterada(uid) { return 'memorial_pwset_' + uid; }

function redirecionarOuCards(perfil) {
  if (perfil === 'mae')     { location.replace('mae.html'); return; }
  if (perfil === 'pai')     { location.replace('pai.html'); return; }
  if (perfil === 'suporte') {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('suporte-view').classList.add('visivel');
  }
}

onAuthStateChanged(auth, user => {
  document.getElementById('loading').style.display = 'none';
  if (!user) return;

  const perfil = perfilDoEmail(user.email);
  if (!perfil) { auth.signOut(); return; }

  // Primeiro acesso: senha ainda não foi trocada neste dispositivo
  if (!localStorage.getItem(chaveAlterada(user.uid))) {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('modal-senha').classList.add('ativo');
    setTimeout(() => document.getElementById('nova-senha').focus(), 120);
    return;
  }

  redirecionarOuCards(perfil);
});

window.fazerLogin = async function() {
  const email = document.getElementById('inp-email').value.trim();
  const senha = document.getElementById('inp-senha').value;
  const btn   = document.getElementById('login-btn');
  const erro  = document.getElementById('login-erro');

  if (!email || !senha) { erro.textContent = 'Preencha e-mail e senha.'; return; }
  erro.textContent = '';
  btn.textContent = '...'; btn.disabled = true;

  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch(e) {
    erro.textContent = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
      ? 'E-mail ou senha incorretos.'
      : 'Erro ao entrar. Tente novamente.';
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
};

window.recuperarSenha = async function() {
  const email = document.getElementById('inp-email').value.trim();
  const erro  = document.getElementById('login-erro');
  const ok    = document.getElementById('login-ok-msg');

  erro.textContent = ''; ok.textContent = '';
  if (!email) { erro.textContent = 'Digite seu e-mail primeiro.'; return; }

  try {
    await sendPasswordResetEmail(auth, email);
    ok.textContent = '✓ Email de recuperação enviado! Verifique sua caixa de entrada.';
  } catch(e) {
    erro.textContent = 'Não foi possível enviar. Verifique o e-mail digitado.';
  }
};

window.salvarSenha = async function() {
  const nova    = document.getElementById('nova-senha').value;
  const conf    = document.getElementById('conf-senha').value;
  const btn     = document.getElementById('btn-salvar');
  const erro    = document.getElementById('modal-erro');
  const ok      = document.getElementById('modal-ok');

  erro.textContent = ''; ok.textContent = '';

  if (!nova)          { erro.textContent = 'Digite a nova senha.'; return; }
  if (nova.length < 6){ erro.textContent = 'Mínimo de 6 caracteres.'; return; }
  if (nova !== conf)  { erro.textContent = 'As senhas não coincidem.'; return; }
  if (nova === SENHA_PADRAO) { erro.textContent = 'Use uma senha diferente da padrão.'; return; }

  btn.textContent = '...'; btn.disabled = true;

  try {
    await updatePassword(auth.currentUser, nova);
    localStorage.setItem(chaveAlterada(auth.currentUser.uid), '1');
    ok.textContent = '✓ Senha definida!';
    setTimeout(() => {
      document.getElementById('modal-senha').classList.remove('ativo');
      redirecionarOuCards(perfilDoEmail(auth.currentUser.email));
    }, 900);
  } catch(e) {
    erro.textContent = 'Erro ao salvar. Tente novamente.';
    btn.textContent = 'Salvar senha'; btn.disabled = false;
  }
};
</script>

</body>
</html>
