<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memorial Glenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #25d366;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background: #0a0c0f;
      color: #fff;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(37,211,102,0.04) 0%, transparent 50%),
                  #0a0c0f;
    }

    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem max(2rem, env(safe-area-inset-bottom));
      text-align: center;
      gap: 0;
    }

    .flor {
      font-size: 2.4rem;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: surgir 0.8s ease 0.1s forwards;
    }

    .nome {
      font-family: var(--serif);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 400; letter-spacing: 0.06em;
      color: #fff; line-height: 1;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.2s forwards;
    }

    .datas {
      font-size: 0.78rem; font-weight: 300;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.35s forwards;
    }

    .linha {
      width: 40px; height: 1px;
      background: var(--green); opacity: 0.7;
      margin: 0 auto 2rem;
      animation: surgir 0.9s ease 0.4s forwards;
      opacity: 0;
    }

    .pergunta {
      font-size: 0.88rem; font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.5s forwards;
    }

    .cards {
      display: flex; gap: 1rem;
      justify-content: center; flex-wrap: wrap;
      opacity: 0;
      animation: surgir 1s ease 0.65s forwards;
    }

    .card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.6rem;
      width: 160px; min-height: 160px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(6px);
      padding: 1.5rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.12) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover::before { opacity: 1; }
    .card:hover {
      border-color: rgba(37,211,102,0.4);
      background: rgba(255,255,255,0.07);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(37,211,102,0.15);
    }
    .card:active { transform: translateY(-1px) scale(0.98); }

    .card-emoji { font-size: 2.4rem; line-height: 1; }
    .card-nome  { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
    .card-papel { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; }

    .rodape {
      position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0; right: 0; text-align: center;
      font-size: 0.72rem; color: rgba(255,255,255,0.18);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: surgir 1s ease 1s forwards;
    }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corrige opacidade inicial das animações encadeadas */
    .linha { opacity: 0 !important; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="page">
    <div class="flor">🌸</div>
    <h1 class="nome">Glenda</h1>
    <p class="datas">21 / 01 / 2004 — 30 / 07 / 2024</p>
    <div class="linha"></div>
    <p class="pergunta">Quem é você?</p>
    <div class="cards">
      <a href="mae.html" class="card" onclick="lembrar('mae')">
        <span class="card-emoji">💚</span>
        <span class="card-nome">Simone</span>
        <span class="card-papel">Mãe</span>
      </a>
      <a href="pai.html" class="card" onclick="lembrar('pai')">
        <span class="card-emoji">🐰</span>
        <span class="card-nome">Marcos</span>
        <span class="card-papel">Pai</span>
      </a>
    </div>
  </div>
  <p class="rodape">Memorial Glenda &mdash; para sempre em nossos corações</p>

  <script>
    function lembrar(quem) {
      try { localStorage.setItem('memorial_quem', quem); } catch(e) {}
    }
    // Se já escolheu, redireciona direto
    try {
      const quem = localStorage.getItem('memorial_quem');
      if (quem === 'mae') location.replace('mae.html');
      else if (quem === 'pai') location.replace('pai.html');
    } catch(e) {}
  </script>
</body>
</html>
