<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Memorial Glenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #25d366;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background: #0a0c0f;
      color: #fff;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(37,211,102,0.04) 0%, transparent 50%),
                  #0a0c0f;
    }

    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem max(2rem, env(safe-area-inset-bottom));
      text-align: center;
      gap: 0;
    }

    .flor {
      font-size: 2.4rem;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: surgir 0.8s ease 0.1s forwards;
    }

    .nome {
      font-family: var(--serif);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 400; letter-spacing: 0.06em;
      color: #fff; line-height: 1;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.2s forwards;
    }

    .datas {
      font-size: 0.78rem; font-weight: 300;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.35s forwards;
    }

    .linha {
      width: 40px; height: 1px;
      background: var(--green); opacity: 0.7;
      margin: 0 auto 2rem;
      animation: surgir 0.9s ease 0.4s forwards;
      opacity: 0;
    }

    .pergunta {
      font-size: 0.88rem; font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: surgir 0.9s ease 0.5s forwards;
    }

    .cards {
      display: flex; gap: 1rem;
      justify-content: center; flex-wrap: wrap;
      opacity: 0;
      animation: surgir 1s ease 0.65s forwards;
    }

    .card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.6rem;
      width: 160px; min-height: 160px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(6px);
      padding: 1.5rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 0%, rgba(37,211,102,0.12) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover::before { opacity: 1; }
    .card:hover {
      border-color: rgba(37,211,102,0.4);
      background: rgba(255,255,255,0.07);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(37,211,102,0.15);
    }
    .card:active { transform: translateY(-1px) scale(0.98); }

    .card-emoji { font-size: 2.4rem; line-height: 1; }
    .card-nome  { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
    .card-papel { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; }

    .rodape {
      position: absolute; bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0; right: 0; text-align: center;
      font-size: 0.72rem; color: rgba(255,255,255,0.18);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: surgir 1s ease 1s forwards;
    }

    /* PIN overlay */
    .pin-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      align-items: center; justify-content: center;
    }
    .pin-overlay.ativo { display: flex; }
    .pin-box {
      background: #12181f; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 2rem 2.5rem;
      text-align: center; min-width: 260px;
    }
    .pin-titulo { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 0.4rem; }
    .pin-sub { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 1.4rem; }
    .pin-input {
      width: 100%; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      color: #fff; font-size: 1.4rem; letter-spacing: 0.4em;
      text-align: center; padding: 0.7rem 1rem;
      font-family: var(--sans); outline: none;
      transition: border-color 0.2s;
    }
    .pin-input:focus { border-color: var(--green); }
    .pin-erro { font-size: 0.8rem; color: #ff6b6b; margin-top: 0.6rem; min-height: 1rem; }
    .pin-btns { display: flex; gap: 0.6rem; margin-top: 1rem; }
    .pin-btn {
      flex: 1; padding: 0.7rem; border-radius: 10px; border: none;
      font-size: 0.92rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: all 0.2s;
    }
    .pin-btn-ok { background: var(--green); color: #fff; }
    .pin-btn-ok:hover { background: #1db954; }
    .pin-btn-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
    .pin-btn-cancel:hover { background: rgba(255,255,255,0.14); }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corrige opacidade inicial das animações encadeadas */
    .linha { opacity: 0 !important; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="page">
    <div class="flor">🌸</div>
    <h1 class="nome">Glenda</h1>
    <p class="datas">21 / 01 / 2004 — 30 / 07 / 2024</p>
    <div class="linha"></div>
    <p class="pergunta">Quem é você?</p>
    <div class="cards">
      <div class="card" onclick="abrirPin('mae')">
        <span class="card-emoji">💚</span>
        <span class="card-nome">Simone</span>
        <span class="card-papel">Mãe</span>
      </div>
      <div class="card" onclick="abrirPin('pai')">
        <span class="card-emoji">🐰</span>
        <span class="card-nome">Marcos</span>
        <span class="card-papel">Pai</span>
      </div>
    </div>
  </div>

  <!-- PIN overlay -->
  <div class="pin-overlay" id="pin-overlay">
    <div class="pin-box">
      <div class="pin-titulo" id="pin-titulo">Simone</div>
      <div class="pin-sub">Digite sua senha</div>
      <input class="pin-input" id="pin-input" type="password" maxlength="20"
             placeholder="••••" autocomplete="off"
             onkeydown="if(event.key==='Enter')confirmarPin()">
      <div class="pin-erro" id="pin-erro"></div>
      <div class="pin-btns">
        <button class="pin-btn pin-btn-cancel" onclick="fecharPin()">Cancelar</button>
        <button class="pin-btn pin-btn-ok"     onclick="confirmarPin()">Entrar</button>
      </div>
    </div>
  </div>
  </div>
  <p class="rodape">Memorial Glenda &mdash; para sempre em nossos corações</p>

  <script>
    // Senhas com hash SHA-256 — para mudar, gere o hash em: https://emn178.github.io/online-tools/sha256.html
    // e substitua os valores abaixo

    async function sha256(msg) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // Hashes SHA-256 das senhas (glenda2024 para ambos por padrão)
    const SENHA_MAE = '6f67bb407548d8f36b6d22de280db4f1fa44e415c0e41dbe148c332a03df5eaa'; // glenda2024
    const SENHA_PAI = '6f67bb407548d8f36b6d22de280db4f1fa44e415c0e41dbe148c332a03df5eaa'; // glenda2024

    let _pinAlvo = null;

    function abrirPin(quem) {
      _pinAlvo = quem;
      document.getElementById('pin-titulo').textContent = quem === 'mae' ? 'Simone' : 'Marcos';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-erro').textContent = '';
      document.getElementById('pin-overlay').classList.add('ativo');
      setTimeout(() => document.getElementById('pin-input').focus(), 100);
    }

    function fecharPin() {
      document.getElementById('pin-overlay').classList.remove('ativo');
      _pinAlvo = null;
    }

    async function confirmarPin() {
      const val = document.getElementById('pin-input').value;
      if (!val) return;
      const hash = await sha256(val);
      const esperado = _pinAlvo === 'mae' ? SENHA_MAE : SENHA_PAI;
      if (hash === esperado) {
        try { localStorage.setItem('memorial_quem', _pinAlvo); } catch(e) {}
        location.replace(_pinAlvo + '.html');
      } else {
        document.getElementById('pin-erro').textContent = 'Senha incorreta.';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
      }
    }

    // Se já está autenticado, redireciona direto
    try {
      const quem = localStorage.getItem('memorial_quem');
      if (quem === 'mae') location.replace('mae.html');
      else if (quem === 'pai') location.replace('pai.html');
    } catch(e) {}
  </script>
</body>
</html>
